name: CI/CD - Balanca IoT

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ==========================================
  # JOB 1: Testes do Backend (Node.js + ML)
  # ==========================================
  test-backend:
    name: Testes Backend + ML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Rodar testes com cobertura
        working-directory: backend
        run: npm run test:ci

      - name: Upload cobertura
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/

  # ==========================================
  # JOB 2: Testes do App React Native
  # ==========================================
  test-app:
    name: Testes App React Native
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        working-directory: app
        run: npm ci

      - name: Rodar testes
        working-directory: app
        run: npm run test:ci

      - name: Upload cobertura
        uses: actions/upload-artifact@v4
        with:
          name: app-coverage
          path: app/coverage/

  # ==========================================
  # JOB 3: Build APK Android (Release)
  # ==========================================
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: [test-backend, test-app]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar dependencias do app
        working-directory: app
        run: npm ci

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*') }}

      - name: Dar permissao ao gradlew
        working-directory: app/android
        run: chmod +x gradlew

      - name: Criar google-services.json placeholder para CI
        run: |
          cat > app/android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "balanca-iot-ci",
              "storage_bucket": "balanca-iot-ci.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.balancaiot" }
              },
              "api_key": [{ "current_key": "CI_PLACEHOLDER_KEY" }],
              "services": {
                "appinvite_service": { "other_platform_oauth_client": [] }
              }
            }],
            "configuration_version": "1"
          }
          EOF

      - name: Build APK Debug
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon
        env:
          JAVA_OPTS: "-Xmx4g"

      - name: Upload APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: BalancaIoT-debug-${{ github.sha }}
          path: app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  # ==========================================
  # JOB 4: Relatorio de Performance (JMeter)
  # ==========================================
  performance-test:
    name: Teste de Performance (JMeter)
    runs-on: ubuntu-latest
    needs: [test-backend]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias do backend
        working-directory: backend
        run: npm ci

      - name: Iniciar servidor backend em background
        working-directory: backend
        run: |
          PORT=3001 npm start &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"
          # Aguarda o servidor responder em /health (timeout ~30s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health > /dev/null; then
              echo "Backend no ar."
              break
            fi
            sleep 1
          done

      - name: Instalar JMeter
        run: |
          sudo apt-get update
          sudo apt-get install -y jmeter

      - name: Rodar teste de performance (JMeter)
        run: |
          mkdir -p jmeter-report
          jmeter -n \
            -t .github/jmeter/api-performance.jmx \
            -l jmeter-report/results.jtl \
            -e -o jmeter-report/html

      - name: Parar servidor backend
        if: always()
        run: kill "$BACKEND_PID" || true

      - name: Upload relatorio de performance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-performance-report
          path: jmeter-report/
          retention-days: 30
        working-directory: backend
        run: |
          node src/index.js &
          sleep 3
          echo "Backend iniciado"

      - name: Setup JMeter
        run: |
          wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          echo "JMETER_HOME=$PWD/apache-jmeter-5.6.3" >> $GITHUB_ENV

      - name: Rodar testes JMeter
        run: |
          $JMETER_HOME/bin/jmeter \
            -n \
            -t .github/jmeter/api-performance.jmx \
            -l /tmp/jmeter-results.jtl \
            -e -o /tmp/jmeter-report \
            || true

      - name: Upload relatorio JMeter
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-performance-report
          path: /tmp/jmeter-report/
          retention-days: 30
